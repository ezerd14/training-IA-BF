[project]
name = "backend-app"
version = "0.1.0"
description = "FastAPI JWT backend application"
authors = [
    {name = "GitHub Copilot",email = "copilot@github.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn (>=0.30.6,<0.31.0)",
    "pyjwt (>=2.12.0,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (>=3.2,<4.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
